- name: Configurar Caddy en VPS
  hosts: vps_publica
  become: true
  vars:
    # Por defecto el sitio está en línea. 
    # Esta variable la sobreescribiremos desde la consola.
    modo_mantenimiento: false

  tasks:
    - name: Crear página de mantenimiento
      file:
        path: /var/www/html/
        state: directory
        mode: "0755"

    - name: Subir pagina HTML de mantenimiento
      copy:
        src: ../templates/maintenance.html
        dest: /var/www/html/maintenance.html

    - name: Instalar Caddy
      apt:
        name: caddy
        state: present
        update_cache: yes

    - name: Crear directorio de logs
      file:
        path: /var/log/caddy
        state: directory
        owner: caddy
        group: caddy
        mode: "0755"

    - name: Backup del Caddyfile actual
      copy:
        src: /etc/caddy/Caddyfile
        dest: /etc/caddy/Caddyfile.bak.{{ ansible_facts['date_time']['date'] }}
        remote_src: yes
      ignore_errors: true

    - name: Copiar Caddyfile
      template:
        src: ../templates/Caddyfile.j2
        dest: /etc/caddy/Caddyfile
        owner: caddy
        group: caddy
        mode: "0644"
      notify: Recargar Caddy

    - name: Asegurar que Caddy está corriendo
      service:
        name: caddy
        state: started
        enabled: yes

  handlers:
    - name: Recargar Caddy
      service:
        name: caddy
        state: reloaded
